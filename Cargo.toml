[workspace]
resolver = "2"
members = [
    "crates/api",
    "crates/artifact-package",
    "crates/artifacts",
    "crates/backend-bb",
    "crates/cli",
    "crates/demo-fixture-generator",
    "crates/noir-witness-core",
    "crates/platform-ffi",
    "conformance",
    "crates/proto",
    "crates/proto-codec",
    "crates/release-process",
    "crates/release-assembly",
    "crates/root-status-authority",
]
exclude = [
    "circuits",
    "fuzz",
]

[workspace.package]
edition = "2021"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/reallyme/zk"
publish = false

[workspace.dependencies]
base64 = { version = "0.23.1", default-features = false, features = ["alloc"] }
buffa = { version = "0.9.2", features = ["json"] }
cc = "1.11.1"
flate2 = "1.1.11"
libc = "0.2"
acir = { version = "=1.0.0", git = "https://github.com/noir-lang/noir", rev = "275d3ab1a5c916c6ea73e8d6b943f685f574500c" }
acvm = { version = "=1.0.0", git = "https://github.com/noir-lang/noir", rev = "275d3ab1a5c916c6ea73e8d6b943f685f574500c" }
bn254_blackbox_solver = { version = "=1.0.0", git = "https://github.com/noir-lang/noir", rev = "275d3ab1a5c916c6ea73e8d6b943f685f574500c" }
noirc_abi = { version = "=1.0.0", git = "https://github.com/noir-lang/noir", rev = "275d3ab1a5c916c6ea73e8d6b943f685f574500c" }
noirc_artifacts = { version = "=1.0.0", git = "https://github.com/noir-lang/noir", rev = "275d3ab1a5c916c6ea73e8d6b943f685f574500c" }
p256 = { version = "0.14.0", default-features = false, features = ["ecdsa"] }
reallyme-codec = { version = "0.3.2", default-features = false }
crypto-core = { package = "reallyme-crypto-core", version = "=0.3.17", default-features = false }
crypto-csprng = { package = "reallyme-crypto-csprng", version = "=0.3.17", default-features = false }
crypto-hkdf = { package = "reallyme-crypto-hkdf", version = "=0.3.17", default-features = false }
crypto-p256 = { package = "reallyme-crypto-p256", version = "=0.3.17", default-features = false }
crypto-poseidon2 = { package = "reallyme-crypto-poseidon2", version = "=0.3.17", default-features = false }
crypto-sha2-256 = { package = "reallyme-crypto-sha2-256", version = "=0.3.17", default-features = false }
reallyme-ssi-proto = { version = "=0.6.1", default-features = false }
rmp-serde = "1.3.1"
secrecy = "0.10.3"
serde = "1.0"
serde_json = "1.0"
sha2 = "0.11"
subtle = "2.6"
thiserror = "2.0"
toml = "1.2.1"
zeroize = { version = "1.9", features = ["zeroize_derive"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.mobile-release]
inherits = "release"
panic = "unwind"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
wildcard_imports = "deny"
large_include_file = "deny"
disallowed_methods = "deny"
disallowed_types = "deny"
