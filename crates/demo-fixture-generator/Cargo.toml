[package]
name = "reallyme-zk-demo-fixture-generator"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false
description = "Private fixture generation tool for ReallyMe ZK mobile examples."

[[bin]]
name = "generate-demo-flow-inputs"
path = "src/generate-demo-flow-inputs.rs"

[[bin]]
name = "generate-private-persona-distinct-fixtures"
path = "src/generate-private-persona-distinct-fixtures.rs"

[[bin]]
name = "generate-common-credential-root-mobile-fixtures"
path = "src/generate-common-credential-root-mobile-fixtures.rs"

[dependencies]
base64.workspace = true
buffa.workspace = true
p256.workspace = true
reallyme-zk-proto = { path = "../proto", version = "0.3.0", default-features = false, features = ["generated"] }
reallyme-zk-proto-codec = { path = "../proto-codec", version = "0.1.0" }
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize.workspace = true

[lints]
workspace = true
