[package]
name = "reallyme-zk-proto-codec"
version = "0.3.1"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = true
include = [
    "/src/**/*.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]
description = "Strict protobuf/domain conversion for ReallyMe ZK contracts."

[features]
default = []
native = ["reallyme-zk-api/native", "crypto-p256/native"]
stack-error = [
    "dep:reallyme-ssi-proto",
    "reallyme-ssi-proto/generated",
]
wasm = ["reallyme-zk-api/wasm", "crypto-p256/wasm"]

[dependencies]
buffa = { workspace = true }
crypto-csprng = { workspace = true }
crypto-p256 = { workspace = true }
reallyme-ssi-proto = { workspace = true, optional = true }
reallyme-zk-api = { path = "../api", version = "0.3.0", default-features = false }
reallyme-zk-artifacts = { path = "../artifacts", version = "0.3.0", default-features = false }
reallyme-zk-proto = { path = "../proto", version = "0.3.0", default-features = false, features = ["generated"] }
serde = { workspace = true }
serde_json = { workspace = true }
subtle = { workspace = true }
thiserror = { workspace = true }
zeroize = { workspace = true }

[dev-dependencies]
crypto-core = { workspace = true }
crypto-sha2-256 = { workspace = true }
reallyme-zk-api = { path = "../api", version = "0.3.0", default-features = false, features = ["native"] }

[lints]
workspace = true
