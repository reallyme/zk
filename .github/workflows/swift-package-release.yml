name: Swift Package Release

run-name: Swift package release ${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version without leading v
        required: true
        type: string
        default: 0.3.1

permissions:
  contents: read

concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  verify-release-sha:
    name: Verify reviewed release SHA
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    outputs:
      release_sha: ${{ github.sha }}
      preflight_run_id: ${{ steps.preflight.outputs.preflight_run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"
      - id: preflight
        name: Require current main and successful Swift package checks
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          node scripts/verify_sdk_release_version.mjs "${RELEASE_VERSION}"
          node scripts/verify_swift_release_preflight.mjs

  swift-release:
    name: SwiftPM release tag
    needs: verify-release-sha
    runs-on: xcode-27
    environment: github-release
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-release-sha.outputs.release_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download verified Swift artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: swift-xcframework-${{ inputs.version }}-${{ needs.verify-release-sha.outputs.release_sha }}
          path: build
          github-token: ${{ github.token }}
          run-id: ${{ needs.verify-release-sha.outputs.preflight_run_id }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0
          components: llvm-tools-preview

      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Verify the reviewed Swift archive and committed manifest
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          archive="$(node scripts/release-artifact-manifest.mjs swiftpm/ReallyMeZKPlatformFFI.xcframework.zip)"
          node scripts/verify_swift_release_artifact.mjs "$archive" build/swift/ReallyMeZKPlatformFFI.xcframework.checksum Package.swift "${RELEASE_VERSION}"
          cmp packages/swift/ReallyMeZKPlatformFFI.xcframework.build.tsv build/swift/ReallyMeZKPlatformFFI.xcframework.build.tsv

      - name: Publish the reviewed Swift archive to the canonical release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.verify-release-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          SWIFT_PREFLIGHT_RUN_ID: ${{ needs.verify-release-sha.outputs.preflight_run_id }}
        run: |
          set -euo pipefail
          node scripts/verify_swift_release_preflight.mjs
          if ! git diff --quiet HEAD --; then
            echo "::error::Swift release verification modified the reviewed source"
            exit 1
          fi
          archive="$(node scripts/release-artifact-manifest.mjs swiftpm/ReallyMeZKPlatformFFI.xcframework.zip)"
          node scripts/publish_github_release.mjs --publish --swift \
            "$archive" \
            build/swift/ReallyMeZKPlatformFFI.xcframework.build.tsv
