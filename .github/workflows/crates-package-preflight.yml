name: Crates Package Preflight

env:
  CARGO_AUDIT_VERSION: 0.22.2

run-name: Crates package preflight ${{ inputs.version }} @ ${{ github.sha }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version for all five crates, without leading v
        required: true
        type: string
        default: 0.3.2

permissions:
  actions: read
  contents: read

concurrency:
  group: crates-package-preflight-${{ inputs.version }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-source-sha:
    name: verify release source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    outputs:
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
    steps:
      - name: Checkout requested release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: zk
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install pinned Buf for public schema compatibility
        uses: bufbuild/buf-setup-action@a47c93e0b1648d5651a065437926377d060baa99 # v1.50.0
        with:
          version: 1.75.0
          github_token: ${{ github.token }}

      - name: Check pinned public protobuf baseline
        working-directory: zk
        run: scripts/check-proto-breaking.sh

      - name: Bind source, current main, and public crate versions
        id: verify-source
        working-directory: zk
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/verify_release_source.mjs

  packages:
    name: review crates.io packages
    needs: verify-source-sha
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CXX: clang++-20
    steps:
      - name: Checkout exact ZK source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-source-sha.outputs.release_sha }}
          fetch-depth: 0
          path: zk
          persist-credentials: false

      - name: Checkout release-readiness runner
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: reallyme/release-readiness
          ref: 18a6d91d99837e80f92e41fe04effb0b043d754e
          path: zk/.release-readiness
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0

      - name: Assert release Rust toolchain
        run: >-
          test "$(rustc --version --verbose | sed -n 's/^release: //p')" = "1.99.0"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Install cargo-audit
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-audit@${{ env.CARGO_AUDIT_VERSION }}

      - name: Scan complete Git history
        working-directory: zk
        run: scripts/run-gitleaks.sh

      - name: Audit committed lockfiles
        working-directory: zk
        run: scripts/audit_committed_lockfiles.sh

      - name: Run release-readiness repository policy gate
        env:
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        working-directory: zk
        run: node .release-readiness/scripts/run-consumer-check.mjs --policy-only

      - name: Install native archive verification prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-20 libc++-20-dev libc++abi-20-dev
      - name: Admit pinned Linux Barretenberg static library
        shell: bash
        run: |
          set -euo pipefail
          bb_dir="${RUNNER_TEMP}/bb-v6.0.0-static"
          archive="${RUNNER_TEMP}/barretenberg-static-amd64-linux.tar.gz"
          install -d -m 0755 "${bb_dir}"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error --location \
            --retry 3 --retry-max-time 120 --connect-timeout 15 --max-time 120 \
            --output "${archive}" \
            https://github.com/AztecProtocol/aztec-packages/releases/download/v6.0.0/barretenberg-static-amd64-linux.tar.gz
          printf '%s  %s\n' \
            '4040c25d374f20d0641824642db328abaf3847959e503a835060fb03a5a95d9f' \
            "${archive}" | sha256sum --check --strict
          tar -xzf "${archive}" -C "${bb_dir}"
          test -f "${bb_dir}/libbb-external.a"
          echo "REALLYME_BARRETENBERG_LIB_DIR=${bb_dir}" >>"${GITHUB_ENV}"

      - name: Install pinned Rust API compatibility checker
        uses: taiki-e/install-action@41049aa56687c35e0afa74eed4f09cec4f9afabf # v2.85.2
        with:
          tool: cargo-semver-checks@0.50.0

      - name: Require monotonic releases and compatible public APIs
        run: node scripts/check-public-crate-baselines.mjs
        working-directory: zk
        env:
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}

      - name: Inspect packaged sources through bounded crates.io dry-runs
        run: node scripts/publish-crates-in-order.mjs preflight
        working-directory: zk
        env:
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}

      - name: Write reviewed package attestation
        working-directory: zk
        env:
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        run: node scripts/write_release_attestation.mjs

      - name: Upload reviewed package attestation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-zk-crates-preflight-${{ needs.verify-source-sha.outputs.release_version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: zk/release-attestation/crates-preflight.json
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Upload reviewed crate archives
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-zk-crate-archives-${{ needs.verify-source-sha.outputs.release_version }}-${{ needs.verify-source-sha.outputs.release_sha }}
          path: zk/target/package/*.crate
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  attest-reviewed-evidence:
    name: attest reviewed package evidence
    needs: [verify-source-sha, packages]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: Download reviewed package attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: reallyme-zk-crates-preflight-${{ needs.verify-source-sha.outputs.release_version }}-${{ needs.verify-source-sha.outputs.release_sha }}
        run: >-
          gh run download "$ARTIFACT_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$ARTIFACT_NAME"
          --dir release-attestation

      - name: Download reviewed crate archives
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_RUN_ID: ${{ github.run_id }}
          ARTIFACT_NAME: reallyme-zk-crate-archives-${{ needs.verify-source-sha.outputs.release_version }}-${{ needs.verify-source-sha.outputs.release_sha }}
        run: >-
          gh run download "$ARTIFACT_RUN_ID"
          --repo "$GITHUB_REPOSITORY"
          --name "$ARTIFACT_NAME"
          --dir reviewed-crates

      - name: Cryptographically attest reviewed package evidence
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-attestation/crates-preflight.json

      - name: Cryptographically attest reviewed crate archives
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: reviewed-crates/*.crate

      - name: Summarize reviewed release
        env:
          RELEASE_SHA: ${{ needs.verify-source-sha.outputs.release_sha }}
          RELEASE_VERSION: ${{ needs.verify-source-sha.outputs.release_version }}
        run: |
          {
            echo '## Crates package preflight passed'
            echo
            echo "- Version: \`${RELEASE_VERSION}\`"
            echo "- Commit: \`${RELEASE_SHA}\`"
            echo "- Publish set: five approved Rust crates, in dependency order"
            echo "- Attestation run ID: \`${GITHUB_RUN_ID}\`"
          } >> "$GITHUB_STEP_SUMMARY"
