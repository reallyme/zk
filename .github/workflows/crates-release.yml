name: Crates.io Release

run-name: Crates.io release @ ${{ github.sha }}

on:
  workflow_dispatch:

concurrency:
  group: github-release-${{ github.repository }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  verify-preflight:
    name: verify reviewed package preflight
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      actions: read
      attestations: read
      contents: read
    outputs:
      preflight_run_id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
      preflight_run_attempt: ${{ steps.resolve-attestation.outputs.preflight_run_attempt }}
      release_sha: ${{ steps.verify-source.outputs.release_sha }}
      release_version: ${{ steps.verify-source.outputs.release_version }}
    steps:
      - name: Checkout current main release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: zk
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Resolve current release SHA and version
        id: verify-source
        working-directory: zk
        env:
          RELEASE_SHA: ${{ github.sha }}
          RELEASE_SOURCE_DERIVE_VERSION: "1"
          RELEASE_SOURCE_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/verify_release_source.mjs

      - name: Resolve latest reviewed package preflight
        id: resolve-attestation
        working-directory: zk
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_RESOLVE_ONLY: "1"
          RELEASE_ATTESTATION_WAIT_SECONDS: "0"
          RELEASE_ATTESTATION_WRITE_GITHUB_OUTPUT: "1"
        run: node scripts/verify_release_attestation.mjs

      - name: Download reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crates-preflight-${{ steps.verify-source.outputs.release_version }}-${{ steps.verify-source.outputs.release_sha }}
          path: zk/release-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}

      - name: Download reviewed crate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crate-archives-${{ steps.verify-source.outputs.release_version }}-${{ steps.verify-source.outputs.release_sha }}
          path: zk/reviewed-crates
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.resolve-attestation.outputs.preflight_run_id }}

      - name: Verify provenance, source identity, and reviewed bytes
        working-directory: zk
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ steps.resolve-attestation.outputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ steps.resolve-attestation.outputs.preflight_run_attempt }}
          RELEASE_SHA: ${{ steps.verify-source.outputs.release_sha }}
          RELEASE_VERSION: ${{ steps.verify-source.outputs.release_version }}
          RELEASE_ATTESTATION_WAIT_SECONDS: "0"
          RELEASE_ATTESTATION_CRATE_DIRECTORY: reviewed-crates
        run: |
          gh attestation verify release-attestation/crates-preflight.json \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/crates-package-preflight.yml" \
            --source-digest "$RELEASE_SHA" \
            --source-ref refs/heads/main \
            --deny-self-hosted-runners
          archive_count=0
          for archive in reviewed-crates/*.crate; do
            if [ ! -f "$archive" ]; then
              continue
            fi
            gh attestation verify "$archive" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/crates-package-preflight.yml" \
              --source-digest "$RELEASE_SHA" \
              --source-ref refs/heads/main \
              --deny-self-hosted-runners
            archive_count=$((archive_count + 1))
          done
          expected_archive_count="$(node --input-type=module -e '
            import { PUBLIC_CRATE_NAMES } from "./scripts/public-crates.mjs";
            process.stdout.write(String(PUBLIC_CRATE_NAMES.length));
          ')"
          test "$archive_count" -eq "$expected_archive_count"
          node scripts/verify_release_attestation.mjs

  prepare-source-release:
    name: prepare immutable source identity
    needs: verify-preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Prepare the canonical release identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/publish_github_release.mjs --prepare

  publish:
    name: publish ReallyMe ZK crates
    needs: [verify-preflight, prepare-source-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: crates-io
    concurrency:
      group: crates-release-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
      cancel-in-progress: false
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout certified release commit without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          fetch-depth: 0
          path: zk
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@2c7215f132e9ebf062739d9130488b56d53c060c # master
        with:
          toolchain: 1.99.0

      - name: Assert release Rust toolchain
        run: >-
          test "$(rustc --version --verbose | sed -n 's/^release: //p')" = "1.99.0"

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Download reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crates-preflight-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: zk/release-attestation
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-preflight.outputs.preflight_run_id }}

      - name: Download attested crate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crate-archives-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: zk/reviewed-crates
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-preflight.outputs.preflight_run_id }}

      - name: Revalidate current main immediately before publication
        working-directory: zk
        run: node scripts/verify_release_source.mjs

      - name: Reverify reviewed package bytes before requesting a publishing token
        working-directory: zk
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ needs.verify-preflight.outputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ needs.verify-preflight.outputs.preflight_run_attempt }}
          RELEASE_ATTESTATION_WAIT_SECONDS: "0"
          RELEASE_ATTESTATION_CRATE_DIRECTORY: reviewed-crates
        run: node scripts/verify_release_attestation.mjs

      - name: Publish crates in reviewed dependency order
        working-directory: zk
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PUBLICATION_LEDGER_PATH: ${{ runner.temp }}/crates-publication-ledger.json
          REVIEWED_CRATE_DIRECTORY: reviewed-crates
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is required"
            exit 1
          fi
          node scripts/publish-crates-in-order.mjs publish
          test -s "$PUBLICATION_LEDGER_PATH"

      - name: Preserve machine-readable publication ledger
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reallyme-zk-publication-ledger-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: ${{ runner.temp }}/crates-publication-ledger.json
          # An early failure may precede ledger creation. Keep partial ledgers
          # when present without replacing the original error with upload noise.
          if-no-files-found: warn
          retention-days: 90
          overwrite: true

      - name: Summarize crates.io publication
        run: |
          {
            echo '## crates.io publication completed'
            echo
            echo "- [reallyme-zk-api ${RELEASE_VERSION}](https://crates.io/crates/reallyme-zk-api/${RELEASE_VERSION})"
            echo "- [reallyme-zk-artifacts ${RELEASE_VERSION}](https://crates.io/crates/reallyme-zk-artifacts/${RELEASE_VERSION})"
            echo "- [reallyme-zk-proto ${RELEASE_VERSION}](https://crates.io/crates/reallyme-zk-proto/${RELEASE_VERSION})"
            echo "- [reallyme-zk-proto-codec ${RELEASE_VERSION}](https://crates.io/crates/reallyme-zk-proto-codec/${RELEASE_VERSION})"
            echo "- [reallyme-zk-backend-bb ${RELEASE_VERSION}](https://crates.io/crates/reallyme-zk-backend-bb/${RELEASE_VERSION})"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    name: finalize GitHub release
    needs: [verify-preflight, prepare-source-release, publish]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify-preflight.outputs.release_sha }}
      RELEASE_VERSION: ${{ needs.verify-preflight.outputs.release_version }}
    steps:
      - name: Checkout reviewed release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.verify-preflight.outputs.release_sha }}
          path: zk
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "26"

      - name: Download reviewed package attestation
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crates-preflight-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-preflight.outputs.preflight_run_id }}

      - name: Download reviewed crate archives
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-crate-archives-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: release-evidence
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ needs.verify-preflight.outputs.preflight_run_id }}

      - name: Download publication ledger
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: reallyme-zk-publication-ledger-${{ needs.verify-preflight.outputs.release_version }}-${{ needs.verify-preflight.outputs.release_sha }}
          path: release-evidence

      - name: Revalidate reviewed evidence before finalization
        env:
          GH_TOKEN: ${{ github.token }}
          PREFLIGHT_RUN_ID: ${{ needs.verify-preflight.outputs.preflight_run_id }}
          PREFLIGHT_RUN_ATTEMPT: ${{ needs.verify-preflight.outputs.preflight_run_attempt }}
          RELEASE_ATTESTATION_PATH: release-evidence/crates-preflight.json
          RELEASE_ATTESTATION_CRATE_DIRECTORY: release-evidence
          RELEASE_ATTESTATION_WAIT_SECONDS: "0"
        run: node zk/scripts/verify_release_attestation.mjs

      - name: Publish reviewed crate evidence to the canonical release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node zk/scripts/publish_github_release.mjs --publish \
            release-evidence/crates-preflight.json \
            release-evidence/crates-publication-ledger.json \
            "release-evidence/reallyme-zk-api-${RELEASE_VERSION}.crate" \
            "release-evidence/reallyme-zk-artifacts-${RELEASE_VERSION}.crate" \
            "release-evidence/reallyme-zk-proto-${RELEASE_VERSION}.crate" \
            "release-evidence/reallyme-zk-proto-codec-${RELEASE_VERSION}.crate" \
            "release-evidence/reallyme-zk-backend-bb-${RELEASE_VERSION}.crate"
